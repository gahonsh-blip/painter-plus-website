# Simple workflow for deploying static content to GitHub Pages
name: Deploy static content to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Single deploy job since we're just deploying
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      # Stage ONLY the public website files. The repository also holds internal
      # material (AGENTS.md, README.md, docs/, tests/) that must never be
      # published — AGENTS.md and README.md document the staff passcode and the
      # whole internal architecture, and they were previously served live at
      # /AGENTS.md and /README.md. Uploading `path: '.'` shipped all of it.
      - name: Stage public site files
        run: |
          set -eu
          mkdir -p _site
          cp -R css js images _site/
          cp ./*.html manifest.json sw.js robots.txt sitemap.xml _headers _site/
          # Fail loudly if an internal file ever slips into the staged site.
          if find _site \( -name 'AGENTS.md' -o -name 'README.md' -o -name '*.test.js' \
               -o -name '*-selftest.js' -o -name 'run-*.sh' -o -path '*_site/docs/*' \
               -o -path '*_site/tests/*' \) | grep -q .; then
            echo "::error::Internal files leaked into the staged site"; exit 1
          fi
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Upload only the staged public site.
          path: '_site'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
